# This file is automatically synchronized from https://github.com/Glatzel/template

name: cargo clippy
description: Run Rust lints using cargo clippy

inputs:
  working-directory:
    description: Working directory
    default: .
  options:
    description: Options passed to cargo clippy
    required: false
  args:
    description: Additional arguments passed to cargo clippy
    required: false

runs:
  using: composite
  steps:
    - name: Run clippy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '${{ github.workspace }}/.ci/rust/cargo-clippy.sh'
      env:
        CARGO_CLIPPY_OPTIONS: ${{ inputs.options }}
        CARGO_CLIPPY_ARGS: ${{ inputs.args }}
