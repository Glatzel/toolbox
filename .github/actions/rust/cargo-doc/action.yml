# This file is automatically synchronized from https://github.com/Glatzel/template

name: cargo doc
description: Generate Rust documentation using cargo doc

inputs:
  working-directory:
    description: Working directory
    default: .
  options:
    description: Options passed to cargo doc
    required: false
  args:
    description: Additional arguments passed to cargo doc
    required: false

runs:
  using: composite
  steps:
    - name: Generate documentation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '${{ github.workspace }}/.ci/rust/cargo-doc.sh'
      env:
        CARGO_DOC_OPTIONS: ${{ inputs.options }}
        CARGO_DOC_ARGS: ${{ inputs.args }}
