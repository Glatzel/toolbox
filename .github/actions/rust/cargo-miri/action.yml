# This file is automatically synchronized from https://github.com/Glatzel/template

name: cargo miri
description: Run Rust tests under Miri

inputs:
  working-directory:
    description: Working directory
    default: .
  options:
    description: Options passed to cargo fuzz test
    required: false
  args:
    description: Additional arguments passed to cargo fuzz test
    required: false

runs:
  using: composite
  steps:
    - name: Run Miri tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ github.workspace }}/.ci/rust/cargo-miri.sh
      env:
        CARGO_MIRI_OPTIONS: ${{ inputs.options }}
        CARGO_MIRI_ARGS: ${{ inputs.args }}
