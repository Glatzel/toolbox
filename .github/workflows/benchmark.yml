name: benchmark

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cargo-bench:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        options:
          - -p rax -p rax-nmea --all-features
          - -p spek --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: Glatzel/template/.github/actions/rust/setup-rust@6d2ccb98bd47d6620d887977508e8a61fcd8a5e1 # v2026.10.7
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@6d2ccb98bd47d6620d887977508e8a61fcd8a5e1 # v2026.10.7
        with:
          working-directory: ./rust
          options: ${{ matrix.options }}
