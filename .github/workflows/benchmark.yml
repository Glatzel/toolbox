name: benchmark

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cargo-bench:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        options:
          - -p rax -p rax-nmea --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: Glatzel/template/.github/actions/rust/setup-rust@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
        with:
          working-directory: ./rust
          options: ${{ matrix.options }}
