name: benchmark

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cargo-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Glatzel/template/.github/actions/rust/setup-rust@ea63917412b3b2fa561a8575834475f2be73353b # v2026.8.29
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@ea63917412b3b2fa561a8575834475f2be73353b # v2026.8.29
        with:
          working-directory: ./rust
          options: -p rax -p rax-nmea --all-features
