name: benchmark

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cargo-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Glatzel/template/.github/actions/rust/setup-rust@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
        with:
          working-directory: ./rust
          options: -p rax -p rax-nmea --all-features
