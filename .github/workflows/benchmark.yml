name: benchmark

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cargo-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Glatzel/template/actions/rust/setup-rust@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
      - uses: Glatzel/template/actions/rust/cargo-bench@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./rust
          options: -p rax -p rax-nmea --all-features
