name: benchmark

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cargo-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Glatzel/template/.github/actions/rust/setup-rust@b6b99ea17e01b640542095b6232d3ee5e3e7d4fd # v2026.8.30
      - uses: Glatzel/template/.github/actions/rust/cargo-bench@b6b99ea17e01b640542095b6232d3ee5e3e7d4fd # v2026.8.30
        with:
          working-directory: ./rust
          options: -p rax -p rax-nmea --all-features
