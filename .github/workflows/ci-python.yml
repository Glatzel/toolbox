name: python-CI

on:
  workflow_dispatch:
  workflow_call:
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Set up pixi
          uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
          with:
            run-install: false
      - uses: Glatzel/template/actions/python/pytest@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./python
        env:
          PYTHONPATH: ./src
      - uses: Glatzel/template/actions/common/codecov@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        if: ${{!cancelled()}}
        with:
          flags: ci-python
