name: rust-CI

on:
  workflow_dispatch:
  workflow_call:
defaults:
  run:
    working-directory: ./rust
env:
  WORKDIR: ./rust
jobs:
  cargo-test:
    strategy:
      fail-fast: false
      matrix:
        options:
          - -p arbor -p clap-style -p envoy -p polars-fmt -p rax -p rax-nmea -p serialport-ext --all-features
          - -p kioyu  --all-features
          - -p mischief --no-default-features --features macros
          - -p mischief --no-default-features --features macros,fancy
          - -p clerk --features tracing
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
        with:
          working-directory: ${{env.WORKDIR}}
          options: ${{matrix.options}}
          args: -D warnings
      - uses: Glatzel/template/.github/actions/rust/cargo-test@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
        with:
          working-directory: ${{env.WORKDIR}}
          global-options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/common/codecov@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
        if: ${{!cancelled()}}
        with:
          flags: ci-rust

  cargo-miri:
    strategy:
      fail-fast: false
      matrix:
        machine: [ubuntu-latest]
    runs-on: ${{matrix.machine}}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
            with:
              toolchain: nightly
              components: "miri"
      - uses: Glatzel/template/.github/actions/rust/cargo-miri@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
        with:
          working-directory: ${{env.WORKDIR}}
          options: -p envoy

  cargo-doc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        options:
          - --workspace --all-features --exclude clerk
          - --features tracing -p clerk
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
      - uses: Glatzel/template/.github/actions/rust/cargo-doc@87fb72378e1351f8e78d884443e60f6dcbf15df8 # v2026.9.3
        with:
          working-directory: ${{env.WORKDIR}}
          options: ${{matrix.options}}
