name: rust-CI

on:
  workflow_dispatch:
  workflow_call:
defaults:
  run:
    working-directory: ./rust
env:
  WORKDIR: ./rust
jobs:
  cargo-test:
    strategy:
      fail-fast: false
      matrix:
        options:
          - --workspace --all-features --exclude clerk --exclude mischief
          - -p mischief --no-default-features --features macros
          - -p mischief --no-default-features --features macros,fancy
          - -p clerk --features tracing
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/actions/rust/setup-rust@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/actions/rust/cargo-clippy@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ${{env.WORKDIR}}
          options: ${{matrix.options}}
          args: -D warnings
      - uses: Glatzel/template/actions/rust/cargo-test@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ${{env.WORKDIR}}
          global-options: ${{matrix.options}}
      - uses: Glatzel/template/actions/common/codecov@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        if: ${{!cancelled()}}
        with:
          flags: ci-rust

  cargo-miri:
    strategy:
      fail-fast: false
      matrix:
        machine: [ubuntu-latest]
    runs-on: ${{matrix.machine}}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/actions/rust/setup-rust@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
            with:
              toolchain: nightly
              components: "miri"
      - uses: Glatzel/template/actions/rust/cargo-miri@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ${{env.WORKDIR}}
          options: -p envoy

  cargo-doc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        options:
          - --workspace --all-features --exclude clerk
          - --features tracing -p clerk
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/actions/rust/setup-rust@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
      - uses: Glatzel/template/actions/rust/cargo-doc@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ${{env.WORKDIR}}
          options: ${{matrix.options}}
