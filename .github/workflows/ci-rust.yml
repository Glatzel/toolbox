name: rust-CI

on:
  workflow_dispatch:
  workflow_call:
defaults:
  run:
    working-directory: ./rust
env:
  WORKDIR: ./rust
jobs:
  cargo-test:
    strategy:
      fail-fast: false
      matrix:
        options:
          - -p arbor -p clap-style -p envoy -p kioyu -p polars-fmt -p rax -p rax-nmea -p serialport-ext -p spek --all-features
          - -p mischief --no-default-features --features macros
          - -p mischief --no-default-features --features macros,fancy
          - -p clerk --features tracing
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
        with:
          working-directory: ${{env.WORKDIR}}
          options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/rust/cargo-doc@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
        if: ${{!cancelled()}}
        with:
          working-directory: ${{env.WORKDIR}}
          options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/rust/cargo-test@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
        if: ${{!cancelled()}}
        with:
          working-directory: ${{env.WORKDIR}}
          global-options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/common/codecov@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
        if: ${{!cancelled()}}
        with:
          flags: ci-rust

  cargo-miri:
    strategy:
      fail-fast: false
      matrix:
        machine: [ubuntu-latest]
    runs-on: ${{matrix.machine}}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
            with:
              toolchain: nightly
              components: "miri"
      - uses: Glatzel/template/.github/actions/rust/cargo-miri@e0998b97844397cce9bbb31f349f2cb94c3273b6 # v2026.10.2
        with:
          working-directory: ${{env.WORKDIR}}
          options: -p envoy
