name: rust-CI

on:
  workflow_dispatch:
  workflow_call:
defaults:
  run:
    working-directory: ./rust
env:
  WORKDIR: ./rust
jobs:
  cargo-test:
    strategy:
      fail-fast: false
      matrix:
        options:
          - -p arbor -p clap-style -p envoy -p kioyu -p polars-fmt -p rax -p rax-nmea -p serialport-ext --all-features
          - -p spek --no-default-features --features default-split
          - -p spek --no-default-features --features default-complex
          - -p mischief --no-default-features --features macros
          - -p mischief --no-default-features --features macros,fancy
          - -p clerk --features tracing
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@ad33a0f240851891ccb1498fa5d520aafbec454d # v2026.9.11
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@ad33a0f240851891ccb1498fa5d520aafbec454d # v2026.9.11
        with:
          working-directory: ${{env.WORKDIR}}
          options: ${{matrix.options}}
          args: -D warnings
      - uses: Glatzel/template/.github/actions/rust/cargo-doc@ad33a0f240851891ccb1498fa5d520aafbec454d # v2026.9.11
        if: ${{!cancelled()}}
        with:
          working-directory: ${{env.WORKDIR}}
          options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/rust/cargo-test@ad33a0f240851891ccb1498fa5d520aafbec454d # v2026.9.11
        if: ${{!cancelled()}}
        with:
          working-directory: ${{env.WORKDIR}}
          global-options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/common/codecov@ad33a0f240851891ccb1498fa5d520aafbec454d # v2026.9.11
        if: ${{!cancelled()}}
        with:
          flags: ci-rust

  cargo-miri:
    strategy:
      fail-fast: false
      matrix:
        machine: [ubuntu-latest]
    runs-on: ${{matrix.machine}}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@ad33a0f240851891ccb1498fa5d520aafbec454d # v2026.9.11
            with:
              toolchain: nightly
              components: "miri"
      - uses: Glatzel/template/.github/actions/rust/cargo-miri@ad33a0f240851891ccb1498fa5d520aafbec454d # v2026.9.11
        with:
          working-directory: ${{env.WORKDIR}}
          options: -p envoy
