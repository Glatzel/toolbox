name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 0 16 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lefthook:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/ci-lefthook.yml
    permissions:
      contents: write
      pull-requests: write
  changed:
    outputs:
      changed-benchmark-rax: ${{ steps.main.outputs.benchmark-rax_any_changed }}
      changed-benchmark-rax-nmea: ${{ steps.main.outputs.benchmark-rax-nmea_any_changed }}
      changed-benchmark-spek: ${{ steps.main.outputs.benchmark-spek_any_changed }}
      changed-fuzz-rax: ${{ steps.main.outputs.fuzz-rax_any_changed }}
      changed-fuzz-rax-nmea: ${{ steps.main.outputs.fuzz-rax-nmea_any_changed }}
      changed-python: ${{ steps.main.outputs.python_any_changed }}
      changed-rust: ${{ steps.main.outputs.rust_any_changed }}
      changed-rust-mischief: ${{ steps.main.outputs.rust-mischief_any_changed }}
      changed-rust-envoy: ${{ steps.main.outputs.rust-envoy_any_changed }}

      changed-tools-orc: ${{ steps.main.outputs.tools-orc_any_changed }}
      changed-tools-shook: ${{ steps.main.outputs.tools-shook_any_changed }}
      changed-tools-ttyw: ${{ steps.main.outputs.tools-ttyw_any_changed }}
      changed-tools-vinaya: ${{ steps.main.outputs.tools-vinaya_any_changed }}
    runs-on: ubuntu-slim
    steps:
      - if: ${{github.event_name == 'pull_request'}}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: main
        if: ${{github.event_name == 'pull_request'}}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            benchmark-rax:
              - ./rust/crates/rax/**
            benchmark-rax-nmea:
              - ./rust/crates/rax/**
              - ./rust/crates/rax-nmea/**
            benchmark-spek:
              - ./rust/crates/spek/**
            fuzz-rax:
              - ./fuzz/fuzz-rax/**
            fuzz-rax-nmea:
              - ./fuzz/fuzz-rax-nmea/**
            python:
              - ./python/**
              - ./.github/workflows/ci-python.yml
            rust:
              - ./rust/**
              - ./.github/workflows/ci-rust.yml
            rust-mischief:
              - ./rust/crates/mischief/**
            rust-envoy:
              - ./rust/crates/envoy/**
            tools-orc:
              - ./tools/orc/**
            tools-shook:
              - ./tools/shook/**
            tools-ttyw:
              - ./tools/ttyw/**
            tools-vinaya:
              - ./tools/vinaya/**

  benchmark:
    needs: changed
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'perf')
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: rax
            changed: ${{ needs.changed.outputs.changed-benchmark-rax }}
          - package: rax-nmea
            changed: ${{ needs.changed.outputs.changed-benchmark-rax-nmea }}
          - package: spek
            changed: ${{ needs.changed.outputs.changed-benchmark-spek }}
    steps:
      - name: Skip unchanged benchmark
        if: ${{ matrix.changed != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true

      - if: ${{ matrix.changed != 'false' }}
        uses: Glatzel/template/.github/actions/rust/setup-rust@49c379830041573dc0c1e8d508e4cc9d247a05e1
        # v2026.10.9

      - if: ${{ matrix.changed != 'false' }}
        uses: Glatzel/template/.github/actions/rust/cargo-bench@49c379830041573dc0c1e8d508e4cc9d247a05e1
        with:
          working-directory: ./rust
          options: -p ${{ matrix.package }} --all-features

  fuzz:
    if: ${{github.event_name != 'push'}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fuzz-rax
            pwd: ./fuzz/fuzz-rax
            changed: ${{ needs.changed.outputs.changed-fuzz-rax }}
          - name: fuzz-rax-nmea
            pwd: ./fuzz/fuzz-rax-nmea
            changed: ${{ needs.changed.outputs.changed-fuzz-rax-nmea }}
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            if: ${{ matrix.changed != 'false' }}
          - uses: Glatzel/template/.github/actions/rust/setup-rust@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
            if: ${{ matrix.changed != 'false' }}
            with:
              toolchain: nightly
              components: llvm-tools-preview
      - uses: Glatzel/template/.github/actions/rust/cargo-fuzz@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{ matrix.changed != 'false' }}
        with:
          working-directory: ${{matrix.pwd}}
          target: ${{matrix.name}}
      - uses: Glatzel/template/.github/actions/common/codecov@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{ !cancelled() && matrix.changed != 'false'}}
        with:
          flags: ${{matrix.name}}

  python-ci:
    needs: changed
    if: ${{ needs.changed.outputs.changed-python != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Set up pixi
            uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
            with:
              run-install: false
      - uses: Glatzel/template/.github/actions/python/pytest@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./python
        env:
          PYTHONPATH: ./src
      - uses: Glatzel/template/.github/actions/common/codecov@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{!cancelled()}}
        with:
          flags: ci-python

  rust-ci:
    needs: changed
    if: ${{ needs.changed.outputs.changed-rust != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        options:
          - -p arbor -p clap-style -p envoy -p kioyu -p polars-fmt -p rax -p rax-nmea -p serialport-ext -p spek --all-features
          - -p mischief --no-default-features --features macros
          - -p mischief --no-default-features --features macros,fancy
          - -p clerk --features tracing
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./rust
          options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/rust/cargo-doc@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{!cancelled()}}
        with:
          working-directory: ./rust
          options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/rust/cargo-test@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{!cancelled()}}
        with:
          working-directory: ./rust
          global-options: ${{matrix.options}}
      - uses: Glatzel/template/.github/actions/common/codecov@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{!cancelled()}}
        with:
          flags: ci-rust

  clippy-mischief:
    needs: changed
    if: ${{ needs.changed.outputs.changed-rust-mischief != 'false' &&  github.event_name != 'push'}}
    strategy:
      fail-fast: false
      matrix:
        options:
          - -p mischief --no-default-features --features macros,backtrace,color
          - -p mischief --no-default-features --features macros,backtrace,hyperlink
          - -p mischief --no-default-features --features macros,backtrace,pretty
          - -p mischief --no-default-features --features macros,backtrace,textwrap-full

          - -p mischief --no-default-features --features macros,backtrace,color,hyperlink
          - -p mischief --no-default-features --features macros,backtrace,color,pretty
          - -p mischief --no-default-features --features macros,backtrace,color,textwrap-full
          - -p mischief --no-default-features --features macros,backtrace,hyperlink,pretty
          - -p mischief --no-default-features --features macros,backtrace,hyperlink,textwrap-full
          - -p mischief --no-default-features --features macros,backtrace,pretty,textwrap-full

          - -p mischief --no-default-features --features macros,backtrace,color,hyperlink,pretty
          - -p mischief --no-default-features --features macros,backtrace,color,hyperlink,textwrap-full
          - -p mischief --no-default-features --features macros,backtrace,color,pretty,textwrap-full
          - -p mischief --no-default-features --features macros,backtrace,hyperlink,pretty,textwrap-full
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Set up pixi
            uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
            with:
              run-install: false
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./rust
          options: -p mischief --no-default-features --features macros,backtrace,color

  envoy-miri:
    runs-on: ubuntu-latest
    if: ${{ needs.changed.outputs.changed-rust-envoy != 'false' &&  github.event_name != 'push'}}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
            with:
              toolchain: nightly
              components: "miri"
      - uses: Glatzel/template/.github/actions/rust/cargo-miri@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./rust
          options: -p envoy

  tools-orc:
    needs: changed
    if: ${{ needs.changed.outputs.changed-tools-orc != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.machine }}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./tools/orc
      - uses: Glatzel/template/.github/actions/rust/cargo-test@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./tools/orc
          nextest-options: --all-features --dep-coverage arbor,clap-style,clerk,mischief
          doc: false
      - uses: Glatzel/template/.github/actions/common/codecov@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{!cancelled()}}
        with:
          flags: ci-tools-orc

  tools-shook:
    needs: changed
    if: ${{ needs.changed.outputs.changed-tools-shook != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.machine }}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
            with:
              toolchain: nightly
              components: clippy

      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./tools/shook
      - uses: Glatzel/template/.github/actions/rust/cargo-test@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{matrix.machine == 'ubuntu-latest'}}
        with:
          working-directory: ./tools/shook
          nextest-options: --all-features --dep-coverage clap-style,clerk,mischief,kioyu
          doc: false
      - uses: Glatzel/template/.github/actions/common/codecov@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{!cancelled() && matrix.machine == 'ubuntu-latest'}}
        with:
          flags: ci-tools-shook

  tools-ttyw:
    needs: changed
    if: ${{ needs.changed.outputs.changed-tools-ttyw != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Set up pixi
            uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
            with:
              run-install: false
      - name: frontend
        run: |
          pixi run install
          pixi run check
          pixi run build
        working-directory: ./tools/ttyw
      - uses: Glatzel/template/.github/actions/rust/setup-rust@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          toolchain: nightly
          components: clippy
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./tools/ttyw
      - uses: Glatzel/template/.github/actions/rust/cargo-test@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./tools/ttyw
          doc: false
          nextest-options: --all-features --dep-coverage clap-style,clerk,mischief
      - uses: Glatzel/template/.github/actions/common/codecov@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{!cancelled()}}
        with:
          flags: ci-tools-ttyw

  tools-vinaya:
    needs: changed
    if: ${{ needs.changed.outputs.changed-tools-vinaya != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{matrix.machine}}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/.github/actions/rust/setup-rust@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/.github/actions/rust/cargo-clippy@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{matrix.machine=='ubuntu-latest'}}
        with:
          working-directory: ./tools/vinaya
      - uses: Glatzel/template/.github/actions/rust/cargo-test@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        with:
          working-directory: ./tools/vinaya
          doc: false
          nextest-options: --all-features --dep-coverage clap-style,clerk,mischief
      - uses: Glatzel/template/.github/actions/common/codecov@49c379830041573dc0c1e8d508e4cc9d247a05e1 # v2026.10.9
        if: ${{!cancelled()}}
        with:
          flags: ci-tools-vinaya

  check-point:
    if: ( cancelled() || failure() ) && github.event_name == 'pull_request'
    needs:
      [
        lefthook,
        benchmark,
        fuzz,
        changed,
        python-ci,
        rust-ci,
        clippy-mischief,
        envoy-miri,
        tools-orc,
        tools-shook,
        tools-ttyw,
        tools-vinaya,
      ]
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
