name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  schedule:
    - cron: 0 16 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lefthook:
    if: ${{ github.event_name != 'schedule' }}
    uses: ./.github/workflows/ci-lefthook.yml
    permissions:
      contents: write
      pull-requests: write
  changed:
    outputs:
      changed-benchmark: ${{ steps.main.outputs.benchmark_any_changed }}
      changed-python: ${{ steps.main.outputs.python_any_changed }}
      changed-rust: ${{ steps.main.outputs.rust_any_changed }}
      changed-mischief: ${{ steps.main.outputs.mischief_any_changed }}

      changed-tools-orc: ${{ steps.main.outputs.tools-orc_any_changed }}
      changed-tools-shook: ${{ steps.main.outputs.tools-shook_any_changed }}
      changed-tools-ttyw: ${{ steps.main.outputs.tools-ttyw_any_changed }}
      changed-tools-vinaya: ${{ steps.main.outputs.tools-vinaya_any_changed }}
    runs-on: ubuntu-slim
    steps:
      - if: ${{github.event_name == 'pull_request'}}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: main
        if: ${{github.event_name == 'pull_request'}}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            benchmark:
              - ./rust/crates/rax/**
              - ./.github/workflows/benchmark.yml
            python:
              - ./python/**
              - ./.github/workflows/ci-python.yml
            rust:
              - ./rust/**
              - ./.github/workflows/ci-rust.yml
            mischief:
              - ./rust/crates/mischief/**
            tools-orc:
              - ./tools/orc/**
            tools-shook:
              - ./tools/shook/**
            tools-ttyw:
              - ./tools/ttyw/**
            tools-vinaya:
              - ./tools/vinaya/**
  benchmark:
    needs: changed
    if: ${{ needs.changed.outputs.changed-benchmark != 'false' }}
    uses: ./.github/workflows/benchmark.yml
  python-ci:
    needs: changed
    if: ${{ needs.changed.outputs.changed-python != 'false' }}
    uses: ./.github/workflows/ci-python.yml
  rust-ci:
    needs: changed
    if: ${{ needs.changed.outputs.changed-rust != 'false' }}
    uses: ./.github/workflows/ci-rust.yml

  check-mischief:
    needs: changed
    if: ${{ needs.changed.outputs.changed-mischief != 'false' &&  github.event_name != 'push'}}
    strategy:
      fail-fast: false
      matrix:
        options:
          - -p mischief --no-default-features --features macros,backtrace,color
          - -p mischief --no-default-features --features macros,backtrace,hyperlink
          - -p mischief --no-default-features --features macros,backtrace,pretty
          - -p mischief --no-default-features --features macros,backtrace,textwrap-full

          - -p mischief --no-default-features --features macros,backtrace,color,hyperlink
          - -p mischief --no-default-features --features macros,backtrace,color,pretty
          - -p mischief --no-default-features --features macros,backtrace,color,textwrap-full
          - -p mischief --no-default-features --features macros,backtrace,hyperlink,pretty
          - -p mischief --no-default-features --features macros,backtrace,hyperlink,textwrap-full
          - -p mischief --no-default-features --features macros,backtrace,pretty,textwrap-full

          - -p mischief --no-default-features --features macros,backtrace,color,hyperlink,pretty
          - -p mischief --no-default-features --features macros,backtrace,color,hyperlink,textwrap-full
          - -p mischief --no-default-features --features macros,backtrace,color,pretty,textwrap-full
          - -p mischief --no-default-features --features macros,backtrace,hyperlink,pretty,textwrap-full
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Set up pixi
            uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
            with:
              run-install: false
      - uses: Glatzel/template/rust/cargo-clippy@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./rust
          options: -p mischief --no-default-features --features macros,backtrace,color
          args: -D warnings

  tools-orc:
    needs: changed
    if: ${{ needs.changed.outputs.changed-tools-orc != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.machine }}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/actions/rust/setup-rust@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/actions/rust/cargo-clippy@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./tools/orc
      - uses: Glatzel/template/actions/rust/cargo-test@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./tools/orc
          nextest-options: --all-features --dep-coverage arbor,clap-style,clerk,mischief
          doc: false
      - uses: Glatzel/template/actions/common/codecov@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        if: ${{!cancelled()}}
        with:
          flags: ci-tools-orc

  tools-shook:
    needs: changed
    if: ${{ needs.changed.outputs.changed-tools-shook != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.machine }}
    steps:
      - parallel:
          - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          - uses: Glatzel/template/actions/rust/setup-rust@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
            with:
              toolchain: nightly
              components: clippy

      - uses: Glatzel/template/actions/rust/cargo-clippy@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./tools/shook
      - uses: Glatzel/template/actions/rust/cargo-test@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        if: ${{matrix.machine == 'ubuntu-latest'}}
        with:
          working-directory: ./tools/shook
          nextest-options: --all-features --dep-coverage clap-style,clerk,mischief,kioyu
          doc: false
      - uses: Glatzel/template/actions/common/codecov@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        if: ${{!cancelled() && matrix.machine == 'ubuntu-latest'}}
        with:
          flags: ci-tools-shook

  tools-ttyw:
    needs: changed
    if: ${{ needs.changed.outputs.changed-tools-ttyw != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Set up pixi
            uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
            with:
              run-install: false
      - name: frontend
        run: |
          pixi run install
          pixi run check
          pixi run build
        working-directory: ./tools/ttyw
      - uses: Glatzel/template/actions/rust/setup-rust@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          toolchain: nightly
          components: clippy
      - uses: Glatzel/template/actions/rust/cargo-clippy@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./tools/ttyw
      - uses: Glatzel/template/actions/rust/cargo-test@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./tools/ttyw
          doc: false
          nextest-options: --all-features --dep-coverage clap-style,clerk,mischief
      - uses: Glatzel/template/actions/common/codecov
        if: ${{!cancelled()}}
        with:
          flags: ci-tools-ttyw

  tools-vinaya:
    needs: changed
    if: ${{ needs.changed.outputs.changed-tools-vinaya != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{matrix.machine}}
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - uses: Glatzel/template/actions/rust/setup-rust@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
            with:
              toolchain: nightly
              components: clippy
      - uses: Glatzel/template/actions/rust/cargo-clippy@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        if: ${{matrix.machine=='ubuntu-latest'}}
        with:
          working-directory: ./tools/vinaya
      - uses: Glatzel/template/actions/rust/cargo-test@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        with:
          working-directory: ./tools/vinaya
          doc: false
          nextest-options: --all-features --dep-coverage clap-style,clerk,mischief
      - uses: Glatzel/template/actions/common/codecov@016957d864d2fb1f40b2e5b86b460a875d88b3c9 # v2026.8.13.0
        if: ${{!cancelled()}}
        with:
          flags: ci-tools-vinaya

  fuzz:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    uses: ./.github/workflows/fuzz.yml

  check-point:
    if: ( cancelled() || failure() ) && github.event_name == 'pull_request'
    needs:
      [
        fuzz,
        benchmark,
        changed,
        lefthook,
        python-ci,
        rust-ci,
        check-mischief,
        tools-orc,
        tools-shook,
        tools-ttyw,
        tools-vinaya,
      ]
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
