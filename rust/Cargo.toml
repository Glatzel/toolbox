[workspace]
resolver = "3"
members = ["./crates/*"]

[workspace.package]
version = "2026.10.5"
edition = "2024"

[workspace.dependencies]
arbor = { path = "./crates/arbor/", default-features = false }
clerk = { path = "./crates/clerk/", default-features = false }
generic-num = { path = "./crates/generic-num/" }
mischief = { path = "./crates/mischief/" }
mischief-macros = { path = "./crates/mischief-macros/" }
rax = { path = "./crates/rax/", default-features = false }

async-trait = "0.1.92"
backtrace = "0.3.76"
clap = "4.6.7"
criterion = { package = "codspeed-criterion-compat", version = "5.0.2" }
defmt = "1.1.1"
derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
float-cmp = "0.10.0"
insta = "1.49.0"
jiff = { version = "0.2.38", default-features = false, features = ["perf-inline"] }
num-traits = "0.2.19"
owo-colors = "4.4.0"
parking_lot = "0.12.5"
phastft = { version = "0.4.1", default-features = false }
quote = "1.0.47"
rayon = "1.12.0"
rstest = "0.27.0"
serde = "1.0.229"
serialport = "4.10.0"
strum = { version = "0.28.0", features = ["derive"] }
syn = "3.0.7"
tempfile = "3.27.0"
terminal_size = "0.4.4"
textwrap = { version = "0.16.4", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.53.2", default-features = false }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-subscriber = "0.3.23"
uuid = "1.28.0"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
