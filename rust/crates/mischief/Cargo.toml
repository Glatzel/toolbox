[package]
name = "mischief"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
mischief-core = { workspace = true, features = ["alloc"] }
mischief-macros.workspace = true
mischief-render = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true, features = ["filters"] }
owo-colors.workspace = true
tempfile.workspace = true
thiserror.workspace = true
trybuild.workspace = true

[features]
default = [
  "backtrace",
  "fancy",
  "macros",
  "mischief-render/arbor-default",
  "std"
]
backtrace = ["mischief-render/backtrace", "std"]
fancy = ["color", "hyperlink", "pretty", "textwrap"]
macros = []
std = ["mischief-render"]

color = ["mischief-render/color", "std"]
hyperlink = ["mischief-render/hyperlink", "std"]
pretty = ["mischief-render/pretty", "std"]

textwrap = [
  "mischief-render/textwrap",
  "std",
]
textwrap-full = ["mischief-render/textwrap-full", "std"]
textwrap-hyphenation = [
  "mischief-render/textwrap-hyphenation",
  "pretty",
  "std",
]
textwrap-smawk = ["mischief-render/textwrap-smawk", "pretty", "std"]
textwrap-unicode-linebreak = [
  "mischief-render/textwrap-unicode-linebreak",
  "pretty",
  "std"
]
textwrap-unicode-width = [
  "mischief-render/textwrap-unicode-width",
  "pretty",
  "std"
]
