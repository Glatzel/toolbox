[package]
name = "mischief"
version.workspace = true
edition.workspace = true

[dependencies]
arbor.workspace = true
backtrace = { workspace = true, optional = true }
mischief-macros = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
terminal_size = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true, features = ["filters"] }

[features]
default = ["arbor/default", "backtrace", "fancy", "macros", "std"]
backtrace = ["dep:backtrace", "std"]
fancy = ["color", "hyperlink", "pretty"]
macros = ["mischief-macros"]
std = []

color = ["arbor/textwrap", "owo-colors", "terminal_size"]
hyperlink = ["arbor/textwrap", "terminal_size"]
pretty = ["arbor/textwrap", "std", "terminal_size"]
textwrap-hyphenation = ["arbor/textwrap-hyphenation", "pretty", "std"]
textwrap-smawk = ["arbor/textwrap-smawk", "pretty", "std"]
textwrap-unicode-linebreak = [
  "arbor/textwrap-unicode-linebreak",
  "pretty",
  "std"
]
textwrap-unicode-width = ["arbor/textwrap-unicode-width", "pretty", "std"]
