[workspace]
resolver = "3"
members = ["./crates/*"]

[workspace.package]
version = "2026.8.4"
edition = "2024"

[workspace.dependencies]
clap-style = { path = "../../rust/crates/clap-style" }
clerk = { path = "../../rust/crates/clerk", features = ["tracing"] }
hou-variable = { path = "./crates/hou-variable" }
hou-where = { path = "./crates/hou-where" }
mischief = { path = "../../rust/crates/mischief" }
sidefx-web = { path = "./crates/sidefx-web" }

assert_cmd = "2.2.2"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
comfy-table = "8.0.0"
dirs = "6.0.0"
glob = "0.3.4"
insta = { version = "1.48.0", features = ["filters"] }
owo-colors = "4.3.0"
path-slash = "0.2.1"
reqwest = { version = "0.13.4", features = ["json"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
rstest = "0.26.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
validator = { version = "0.21.0", features = ["derive"] }
